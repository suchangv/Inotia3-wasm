<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#05070a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Inotia 3">
<title>艾诺迪亚 3 · WebAssembly</title>
<!--
  The game screen. The landing page (index.html) owns importing the APK and
  moving saves around; this page is nothing but the canvas, and it exists for
  one platform: iPhone and iPad.

  Why a second document at all: iOS has no element fullscreen, so the landing
  page can only fake it with a fixed overlay -- which still leaves the browser
  chrome (address bar, tab strip, home indicator) around, and those come back
  the moment the page scrolls or the user taps the top edge. A page whose body
  is exactly one canvas, with no document to scroll, is the closest iOS gives
  WebKit to fullscreen, and it is what "Add to Home Screen" launches into.

  The files come from the same IndexedDB the landing page filled, so there is
  nothing to pass between the two documents.
-->
<style>
  :root { --ink: #1b2430; --ink-2: #69758a; --line: #e3e8ef; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    background: #05070a; color: #fff; overflow: hidden;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent; overscroll-behavior: none;
    font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", Roboto, sans-serif;
  }
  /* 100dvh: on iOS the address bar collapse changes 100vh, and a canvas sized
   * from it jumps when that happens. dvh is the visual viewport height. */
  #stage {
    position: fixed; inset: 0; display: flex; align-items: center;
    justify-content: center; width: 100%; height: 100%; height: 100dvh;
    padding: env(safe-area-inset-top) env(safe-area-inset-right)
             env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  /* Letterboxed, never stretched: the engine renders 960x544 and its input
   * mapping divides by this element's rect, so distortion would move every
   * touch target with it. */
  #canvas {
    display: block; width: 100%; height: 100%; object-fit: contain;
    background: #05070a; touch-action: none;
  }
  .overlay {
    position: fixed; left: 0; right: 0; top: 0; padding: 14px 16px;
    padding-top: calc(14px + env(safe-area-inset-top));
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; pointer-events: none; z-index: 10;
    background: linear-gradient(rgba(5, 7, 10, .66), rgba(5, 7, 10, 0));
    transition: opacity .3s ease; font-size: 13px;
  }
  .overlay.faded { opacity: 0; }
  .overlay .who { color: rgba(255, 255, 255, .72); }
  .overlay a, .overlay button {
    pointer-events: auto; font: inherit; font-weight: 600; text-decoration: none;
    color: #fff; background: rgba(20, 26, 36, .58);
    border: 1px solid rgba(255, 255, 255, .26); border-radius: 999px;
    padding: 8px 14px; cursor: pointer; backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }
  .overlay a:hover, .overlay button:hover { background: rgba(20, 26, 36, .78); }
  #notice {
    position: fixed; inset: 0; z-index: 20; display: none;
    align-items: center; justify-content: center; padding: 24px;
    background: #f5f7fa; color: var(--ink); text-align: center;
  }
  #notice.show { display: flex; }
  #notice .box { max-width: 460px; }
  #notice h1 { font-size: 20px; margin: 0 0 8px; }
  #notice p { color: var(--ink-2); margin: 0 0 18px; }
  #notice p .en { display: block; font-size: 12px; color: #8592a6; margin-top: 4px; }
  #notice a {
    color: #2f6fed; font-weight: 600; text-decoration: none;
    border: 1px solid #d5e2fd; background: #f4f8ff; border-radius: 9px;
    padding: 9px 14px; display: inline-block;
  }
</style>
</head>
<body>
<div id="stage"><canvas id="canvas" width="960" height="544"></canvas></div>

<div class="overlay" id="overlay">
  <span class="who" id="who">艾诺迪亚 3 · Inotia 3</span>
  <a href="index.html" id="exit">退出 / Exit</a>
</div>

<div id="notice">
  <div class="box">
    <h1>还没有可运行的游戏文件</h1>
    <p>Nothing to run yet.
      <span class="en">Import your APK on the main page first; this screen only plays.</span>
    </p>
    <a href="index.html">返回导入 APK / Back to import</a>
  </div>
</div>

<script>
window.Module = {
  spikeUI: true,
  canvas: document.getElementById('canvas'),
  print: function (t) { console.log(t); },
  printErr: function (t) { console.error(t); }
};
</script>
<script src="inotia3.js"></script>
<script>
(function () {
  var api = null, started = false, touched = false;
  var notice = document.getElementById('notice');
  var overlay = document.getElementById('overlay');

  function boot() {
    api = window.Module && window.Module.spike;
    if (!api) { setTimeout(boot, 60); return; }

    api.onState(function (state) {
      if (state === 'no-apk') {
        notice.classList.add('show');
        return;
      }
      notice.classList.remove('show');
      if (state === 'ready' && !started) {
        started = true;
        // There is no click to ride on here -- the tap that got us to this page
        // belonged to the other document. iOS therefore keeps the audio session
        // restricted until the first touch *here*, which is why every pointer
        // event tries again (see the listener below).
        api.audioUnlock();
        api.start();
        // Chrome/Android land here with audio already unlocked; iOS unlocks on
        // the first in-game tap and needs no further prompting.
      }
    });
  }

  // Any touch is a candidate gesture for audio: iOS suspends the context when
  // the app is backgrounded, and only a gesture may resume it.
  function unlock(e) {
    if (!api) return;
    if (!touched) {
      touched = true;
      overlay.classList.add('faded');
    }
    api.audioUnlock();
  }
  ['pointerdown', 'touchstart', 'keydown'].forEach(function (ev) {
    document.addEventListener(ev, unlock, { passive: true });
  });

  document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  document.addEventListener('selectstart', function (e) { e.preventDefault(); });

  boot();
})();
</script>
</body>
</html>
